# Run with prek (https://github.com/j178/prek), which reads this file:
#
#     uv tool install prek
#     prek install --hook-type pre-commit --hook-type pre-push
#
# The hooks are the CI jobs, split by how long they take: what gates a commit
# is what CI fails on first, and the suites wait until you push.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: \.(rs|toml)$|^Cargo\.lock$
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --exclude trace0-py
        language: system
        files: \.(rs|toml|proto)$|^Cargo\.lock$
        pass_filenames: false
        stages: [pre-push]

      # The one crate that links against CPython has no Rust tests, so the
      # interpreter-level suite is the only thing that covers it.
      - id: pytest
        name: pytest
        entry: uv run --python 3.13t pytest -q
        language: system
        files: \.(rs|py|toml|proto)$|^Cargo\.lock$
        pass_filenames: false
        stages: [pre-push]
