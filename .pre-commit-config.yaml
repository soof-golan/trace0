repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: \.(rs|toml)$|^Cargo\.lock$
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --exclude trace0-py
        language: system
        files: \.(rs|toml|proto)$|^Cargo\.lock$
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: uv run --python 3.14t pytest -q
        language: system
        files: \.(rs|py|toml|proto)$|^Cargo\.lock$
        pass_filenames: false
        stages: [pre-push]
