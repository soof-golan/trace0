[project]
name = "useful-tracer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soof Golan", email = "hi@soofgolan.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.maturin]
module-name = "useful_tracer._core"
python-packages = ["useful_tracer"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
