[project]
name = "trace0"
version = "0.1.9"
description = "A low-overhead tracing profiler for Python, built on sys.monitoring, emitting Perfetto traces."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Soof Golan", email = "hi@soofgolan.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://github.com/soof-golan/trace0"
Repository = "https://github.com/soof-golan/trace0"

[project.scripts]
trace0 = "trace0.__main__:main"

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
module-name = "trace0._core"
python-source = "python"
data = "wheel_data"
include = [{ path = "wheel_data/**/*", format = "sdist" }]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/*.proto" },
    { file = "Cargo.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "Cargo.lock" },
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
e2e = [
    "django>=6.0.7",
    "fastapi>=0.141.1",
    "gunicorn>=26.0.0",
    "hypercorn>=0.18.0",
    "uvicorn>=0.52.1",
    "uvloop>=0.22.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: launches a real server; needs the e2e dependency group and runs for minutes",
]
