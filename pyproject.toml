[project]
name = "trace0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soof Golan", email = "hi@soofgolan.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
trace0 = "trace0.__main__:main"

[tool.maturin]
module-name = "trace0._core"
python-packages = ["trace0"]
python-source = "src"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.rs" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/*.proto" },
    { file = "Cargo.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "Cargo.lock" },
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
