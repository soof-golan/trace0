name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `cargo test` runs on the pyo3-free crates: the extension cdylib cannot be
  # linked outside maturin, since `extension-module` deliberately leaves the
  # CPython symbols undefined. clippy needs no linking, so it covers all four.
  rust:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p trace0-core -p trace0-json -p trace0-proto

  # Proves the extension still builds and traces on the interpreters the
  # release matrix targets, before a tag makes it permanent.
  python:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.13t", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Trace a real workload
        run: uv run --python ${{ matrix.python }} scripts/smoke.py

  # The Rust tests decode our protobuf with prost, which only proves we can
  # read back what we wrote. This runs Perfetto's own trace_processor, so
  # the encoding tricks -- interning, bare slice ends, dense track uuids --
  # are checked against the consumer that has to understand them.
  perfetto:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      # Not a free-threaded build: the perfetto package depends on
      # protobuf, which does not publish 3.13t wheels.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - name: Validate the trace with trace_processor
        run: uv run --python 3.13 --with perfetto scripts/verify_perfetto.py
