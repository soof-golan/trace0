name: Release

# Tagging is the release trigger. `git tag v0.1.1 && git push --tags`
# builds every wheel, publishes to PyPI, and cuts the GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 3.13t/3.14t are the free-threaded builds, which is the point of this profiler.
  INTERPRETERS: "3.13 3.13t 3.14 3.14t"

jobs:
  # A tag that disagrees with pyproject.toml would publish a version nobody
  # can reproduce from the source tree. Catch it before anything is built.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match the declared version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag declared=$declared"
          [ "$tag" = "$declared" ]

  linux:
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --interpreter ${{ env.INTERPRETERS }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.13
            3.13t
            3.14
            3.14t
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ env.INTERPRETERS }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [linux, macos, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trace0
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's identity directly,
      # so there is no API token to store or to point at the wrong account.
      id-token: write
      # Attaching the artifacts to the GitHub Release.
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
