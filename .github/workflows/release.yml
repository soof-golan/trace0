name: Release

# Tagging is the release trigger. `git tag v0.1.1 && git push --tags`
# builds every wheel, publishes to PyPI, and cuts the GitHub Release.
on:
  push:
    tags:
      - "v*"
  # Dry run: builds and checks the whole matrix, publishes nothing. Use this
  # to validate a matrix change, because a tag that fails after publishing
  # burns its filenames on PyPI permanently.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag that disagrees with pyproject.toml would publish a version nobody
  # can reproduce from the source tree. Catch it before anything is built.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag declared=$declared"
          [ "$tag" = "$declared" ]

  linux:
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      # Interpreters are named by their absolute path in the manylinux image.
      # There is deliberately no cp313t here: manylinux ships no free-threaded
      # 3.13, because that build was experimental until 3.14.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: >-
            --release --out dist
            --interpreter
            /opt/python/cp313-cp313/bin/python
            /opt/python/cp314-cp314/bin/python
            /opt/python/cp314-cp314t/bin/python
      - name: Every expected wheel was built
        run: ./scripts/check_wheels.sh dist cp313-cp313 cp314-cp314 cp314-cp314t
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.13
            3.13t
            3.14
            3.14t
      # Named by PATH, not by bare version spec: maturin rejects `3.13t` as a
      # spec but builds happily against the interpreter itself. macOS does get
      # a free-threaded 3.13, unlike manylinux.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release --out dist
            --interpreter python3.13 python3.13t python3.14 python3.14t
      - name: Every expected wheel was built
        run: ./scripts/check_wheels.sh dist cp313-cp313 cp313-cp313t cp314-cp314 cp314-cp314t
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [linux, macos, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trace0
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's identity directly,
      # so there is no API token to store or to point at the wrong account.
      id-token: write
      # Attaching the artifacts to the GitHub Release.
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
