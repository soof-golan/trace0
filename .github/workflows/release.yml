name: Release

# Tagging is the release trigger. `git tag v0.1.1 && git push --tags`
# builds every wheel, publishes to PyPI, and cuts the GitHub Release.
on:
  push:
    tags:
      - "v*"
  # Dry run: builds and checks the whole matrix, publishes nothing. Use this
  # to validate a matrix change, because a tag that fails after publishing
  # burns its filenames on PyPI permanently.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag that disagrees with pyproject.toml would publish a version nobody
  # can reproduce from the source tree. Catch it before anything is built.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag declared=$declared"
          [ "$tag" = "$declared" ]

  # Native runners per architecture. Cross-compiling cannot work here: maturin
  # introspects the target interpreter to build, and an aarch64 python inside
  # an x86_64 container is an `Exec format error`.
  linux:
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      # Interpreters are named by their absolute path in the manylinux image.
      # There is deliberately no cp313t: manylinux ships no free-threaded 3.13,
      # because that build was experimental until 3.14.
      - uses: PyO3/maturin-action@v1
        with:
          manylinux: auto
          args: >-
            --release --out dist
            --interpreter
            /opt/python/cp313-cp313/bin/python
            /opt/python/cp314-cp314/bin/python
            /opt/python/cp314-cp314t/bin/python
      - name: Every expected wheel was built
        run: ./scripts/check_wheels.sh dist cp313-cp313 cp314-cp314 cp314-cp314t
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.runner }}
          path: dist

  macos:
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest]
        python: ["3.13", "3.13t", "3.14", "3.14t"]
        include:
          - python: "3.13"
            abi: cp313-cp313
          - python: "3.13t"
            abi: cp313-cp313t
          - python: "3.14"
            abi: cp314-cp314
          - python: "3.14t"
            abi: cp314-cp314t
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: ${{ matrix.python }}
      # One interpreter per job, addressed by the exact path setup-python
      # reports. Installing several at once and naming them on PATH does not
      # work: the free-threaded builds live in PythonT.framework and shadow
      # `python3.13`, so every name silently resolves to a free-threaded build.
      - uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter ${{ steps.py.outputs.python-path }}
      - name: Every expected wheel was built
        run: ./scripts/check_wheels.sh dist ${{ matrix.abi }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.python }}
          path: dist

  windows:
    needs: check-version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.13t", "3.14", "3.14t"]
        include:
          - python: "3.13"
            abi: cp313-cp313
          - python: "3.13t"
            abi: cp313-cp313t
          - python: "3.14"
            abi: cp314-cp314
          - python: "3.14t"
            abi: cp314-cp314t
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      # One interpreter per job, named by the exact path setup-python
      # reports, for the same reason macOS does it: never leave the choice
      # of interpreter to whatever a bare version number resolves to.
      - uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter ${{ steps.py.outputs.python-path }}
      - name: Every expected wheel was built
        # Windows defaults to pwsh, and this script is bash.
        shell: bash
        run: ./scripts/check_wheels.sh dist ${{ matrix.abi }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.python }}
          path: dist

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trace0
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's identity directly,
      # so there is no API token to store or to point at the wrong account.
      id-token: write
      # Attaching the artifacts to the GitHub Release.
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
      # -R is required: this job never checks out, so gh has no git remote to
      # infer the repository from.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            dist/*
