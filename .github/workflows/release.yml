name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          alias=$(grep -m1 '^version = ' alias/tracezero/pyproject.toml | cut -d'"' -f2)
          pin=$(grep -o 'trace0==[0-9a-z.]*' alias/tracezero/pyproject.toml)
          echo "tag=$tag declared=$declared alias=$alias pin=$pin"
          [ "$tag" = "$declared" ] && [ "$tag" = "$alias" ] && [ "trace0==$tag" = "$pin" ]

  linux:
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          manylinux: auto
          args: >-
            --release --out dist
            --interpreter
            /opt/python/cp313-cp313/bin/python
            /opt/python/cp314-cp314/bin/python
            /opt/python/cp314-cp314t/bin/python
      - name: Every expected wheel was built
        run: ./scripts/check_wheels.sh dist cp313-cp313 cp314-cp314 cp314-cp314t
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.runner }}
          path: dist

  macos:
    needs: check-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-latest]
        python: ["3.13", "3.14", "3.14t"]
        include:
          - python: "3.13"
            abi: cp313-cp313
          - python: "3.14"
            abi: cp314-cp314
          - python: "3.14t"
            abi: cp314-cp314t
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          args: >-
            --release --out dist
            --interpreter ${{ steps.py.outputs.python-path }}
      - name: Every expected wheel was built
        run: ./scripts/check_wheels.sh dist ${{ matrix.abi }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.python }}
          path: dist

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  alias:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv build alias/tracezero --out-dir dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-alias
          path: dist

  publish:
    needs: [linux, macos, sdist, alias]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trace0
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            dist/*
