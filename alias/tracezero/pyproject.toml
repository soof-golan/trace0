[project]
name = "tracezero"
version = "0.1.15"
description = "Alias for trace0, the low-overhead tracing profiler for Python."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Soof Golan", email = "hi@soofgolan.com" }
]
requires-python = ">=3.13"
dependencies = ["trace0==0.1.15"]

[project.optional-dependencies]
sentry = ["trace0[sentry]==0.1.15"]
otel = ["trace0[otel]==0.1.15"]

[project.urls]
Homepage = "https://github.com/soof-golan/trace0"
Repository = "https://github.com/soof-golan/trace0"

[project.scripts]
tracezero = "trace0.__main__:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"
